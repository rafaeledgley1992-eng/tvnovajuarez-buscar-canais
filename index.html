<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Nova Juarez</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow:hidden; height:100vh; width:100vw;
  }

  /* PLAYER */
  #videoContainer { position:fixed; inset:0; background:#000; }
  #video { width:100%; height:100%; object-fit:contain; background:#000; }

  /* SPLASH PROFISSIONAL */
  #splash {
    position:fixed; inset:0; z-index:100;
    background: radial-gradient(circle at center, #0a1628 0%, #000 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:20px;
    transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #splash::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(45deg, transparent 40%, rgba(0,180,255,0.05) 50%, transparent 60%);
    animation: brilho 3s infinite;
  }
  @keyframes brilho { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  
  #splash img { 
    width:140px; margin-bottom:25px; 
    filter: drop-shadow(0 0 20px rgba(0,180,255,0.6));
    animation: pulse 2s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  
  #splash h1 { 
    color:#00b4ff; font-size:28px; margin-bottom:20px;
    letter-spacing:2px; text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0,180,255,0.5);
  }
  #splash .creditos {
    font-size:13px; line-height:1.8; color:#a0b8d0;
    max-width: 400px; letter-spacing:0.5px;
  }
  #splash .creditos b { color:#fff; }
  #splash .linha {
    width:60px; height:2px; background:#00b4ff; margin:20px auto;
    border-radius:2px;
  }

  /* HEADER - INFORMAÇÕES (NÃO ATRAPALHA) */
  #headerInfo {
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:15px 20px; pointer-events:none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    opacity:0; transition: opacity 0.5s ease;
  }
  #headerInfo.visivel { opacity:1; }
  
  #canalNome {
    background:rgba(0,0,0,0.7); padding:6px 16px;
    border-radius:20px; font-size:14px;
    border-left:3px solid #00b4ff;
  }
  
  #contadorCanais {
    background:rgba(0,180,255,0.15); padding:6px 16px;
    border-radius:20px; font-size:13px;
    border:1px solid rgba(0,180,255,0.3);
    color:#00b4ff; font-weight:bold;
  }

  /* BOTÕES DE BUSCA (CANTO SUPERIOR DIREITO) */
  #botoesBusca {
    position:fixed; top:70px; right:20px; z-index:45;
    display:flex; flex-direction:column; gap:8px;
    opacity:0; transition: opacity 0.4s ease;
    pointer-events:none;
  }
  #botoesBusca.visivel { opacity:1; pointer-events:auto; }
  
  #botoesBusca button {
    background:rgba(20,30,45,0.9); color:#c0d0e0;
    border:1px solid rgba(0,180,255,0.3);
    padding:10px 18px; border-radius:8px;
    font-size:12px; cursor:pointer; text-align:left;
    transition: all 0.2s; backdrop-filter: blur(10px);
    display:flex; align-items:center; gap:8px;
  }
  #botoesBusca button:hover {
    background:rgba(0,180,255,0.2); color:#fff;
    border-color:#00b4ff;
  }
  #botoesBusca button.ativo {
    background:#00b4ff; color:#000; border-color:#00b4ff;
  }

  /* BARRA DE CONTROLES PRINCIPAL */
  #controles {
    position:fixed; bottom:25px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:60;
    background:rgba(10,15,25,0.85); padding:12px 20px;
    border-radius:50px; opacity:0; pointer-events:none;
    transition: opacity 0.4s ease; backdrop-filter: blur(15px);
    border: 1px solid rgba(0,180,255,0.15);
  }
  #controles.visivel { opacity:1; pointer-events:auto; }

  #controles button {
    background:rgba(255,255,255,0.08); color:#fff; border:none;
    width:50px; height:50px; border-radius:50%;
    font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: all 0.2s;
  }
  #controles button:hover { background:#00b4ff; transform:scale(1.1); }
  #controles button:active { transform:scale(0.95); }

  /* BOTÃO FLUTUANTE PARA MOSTRAR CONTROLES */
  #btnMostrar {
    position:fixed; bottom:25px; right:25px; z-index:55;
    background:rgba(0,180,255,0.15); color:#00b4ff;
    border:1px solid rgba(0,180,255,0.3); 
    width:48px; height:48px; border-radius:50%;
    font-size:20px; cursor:pointer;
    opacity:0.4; transition: all 0.3s;
    backdrop-filter: blur(10px);
  }
  #btnMostrar:hover { opacity:1; background:rgba(0,180,255,0.3); }

  /* TOAST DE FEEDBACK */
  #toast {
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:rgba(0,180,255,0.9); color:#000; padding:10px 24px;
    border-radius:25px; font-size:13px; font-weight:bold;
    z-index:200; opacity:0; transition: opacity 0.3s;
    pointer-events:none;
  }
  #toast.visivel { opacity:1; }
</style>
</head>
<body>

<div id="videoContainer">
  <video id="video" playsinline></video>
</div>

<!-- Header info (canal e contador) -->
<div id="headerInfo">
  <div id="canalNome">TV Nova Juarez</div>
  <div id="contadorCanais">0 canais</div>
</div>

<!-- Botões de busca -->
<div id="botoesBusca">
  <button id="btnRegionais" title="Carregar canais regionais da Paraíba">📍 Regionais (PB)</button>
  <button id="btnAnatel" title="Carregar canais de TV aberta do Brasil">🏛️ Anatel / TV Aberta</button>
  <button id="btnInternet" title="Carregar canais internacionais">🌐 Internet / Mundo</button>
</div>

<!-- Splash de abertura -->
<div id="splash">
  <img src="https://i.postimg.cc/nhWqywPS/lv-0-20260616101447.png" alt="Logo">
  <h1>TV Nova Juarez</h1>
  <div class="linha"></div>
  <div class="creditos">
    Aplicativo criado por <b>Rafael Edgley Alves Feliciano</b><br>
    Dono e proprietário da emissora <b>TV Nova Juarez</b><br>
    Criado em: <b>20/01/2023</b>
  </div>
</div>

<!-- Botão para reexibir controles -->
<button id="btnMostrar" title="Mostrar controles">☰</button>

<!-- Barra de controles -->
<div id="controles">
  <button id="btnAnterior" title="Canal anterior">⏮</button>
  <button id="btnProximo" title="Próximo canal">⏭</button>
  <button id="btnFullscreen" title="Tela cheia">⛶</button>
  <button id="btnGirar" title="Girar tela">🔄</button>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   DADOS DO CANAL PRINCIPAL
   ============================================================ */
const URL_TV_NOVA_JUAREZ = "https://stmv2.webtvninjas.com.br/tvnovajuarez/tvnovajuarez/playlist.m3u8";
const LOGO_TV_NOVA_JUAREZ = "https://i.postimg.cc/nhWqywPS/lv-0-20260616101447.png";

const canalTVNovaJuarez = {
  nome: "TV Nova Juarez",
  url: URL_TV_NOVA_JUAREZ,
  logo: LOGO_TV_NOVA_JUAREZ
};

/* ============================================================
   LISTAS DE CANAIS (BASE)
   ============================================================ */

// Lista base inicial (pode adicionar mais canais brasileiros aqui)
const canaisBaseInicial = [
  { nome: "Canal da Paraíba", url: URL_TV_NOVA_JUAREZ, logo: LOGO_TV_NOVA_JUAREZ },
  { nome: "TV Brasil", url: "https://stream.ads.ottera.tv/playlist.m3u8", logo: "" },
  { nome: "TV Câmara", url: "https://stream3.camara.gov.br/tv1/manifest.m3u8", logo: "" },
  { nome: "TV Cultura", url: "https://cdn.jmvstream.com/w/LVW-8403/LVW8403_h0e2h2e2h2/playlist.m3u8", logo: "" }
];

// Listas M3U de fontes públicas (iptv-org / iptv-com)
const LISTAS_BUSCA = {
  regionais: "https://iptv-org.github.io/iptv/countries/br.m3u", // Filtraremos por PB depois
  anatel: "https://iptv-org.github.io/iptv/countries/br.m3u",   // Canais abertos do Brasil
  internet: "https://iptv-org.github.io/iptv/index.m3u"          // Lista global (pode ser pesada)
};

/* ============================================================
   ESTADO ATUAL
   ============================================================ */
let listaCanais = [];
let indiceAtual = 0;
let hls = null;
let listaAtiva = "inicial"; // inicial | regionais | anatel | internet

/* ============================================================
   FUNÇÃO: MONTAR LISTA COM TV NOVA JUAREZ A CADA 5 CANAIS
   ============================================================ */
function montarListaFinal(canaisBase) {
  const lista = [];
  lista.push(canalTVNovaJuarez); // Primeiro canal sempre
  let contador = 0;
  
  for (const canal of canaisBase) {
    // Evita duplicar a TV Nova Juarez se já estiver na base
    if (canal.nome === "TV Nova Juarez") continue;
    
    if (contador > 0 && contador % 5 === 0) {
      lista.push(canalTVNovaJuarez);
    }
    lista.push(canal);
    contador++;
  }
  
  // Se a lista for muito curta, garante pelo menos uma aparição extra no final
  if (lista.length > 1 && lista[lista.length - 1].nome !== "TV Nova Juarez") {
    lista.push(canalTVNovaJuarez);
  }
  
  return lista;
}

/* ============================================================
   ATUALIZAR CONTADOR
   ============================================================ */
function atualizarContador() {
  const total = listaCanais.length;
  const atual = indiceAtual + 1;
  document.getElementById("contadorCanais").textContent = `${atual} / ${total} canais`;
}

/* ============================================================
   TOCAR CANAL
   ============================================================ */
function tocarCanal(indice) {
  const canal = listaCanais[indice];
  if (!canal) return;

  document.getElementById("canalNome").textContent = canal.nome;
  atualizarContador();

  // Destroi player anterior
  if (hls) { hls.destroy(); hls = null; }
  const video = document.getElementById("video");
  video.pause();
  video.removeAttribute("src");
  video.load();

  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = canal.url;
  } else if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(canal.url);
    hls.attachMedia(video);
  } else {
    mostrarToast("Formato não suportado");
    return;
  }

  video.play().catch(() => {});
}

/* ============================================================
   CONTROLES (AUTO-HIDE)
   ============================================================ */
const controles = document.getElementById("controles");
const headerInfo = document.getElementById("headerInfo");
const botoesBusca = document.getElementById("botoesBusca");
let timerEsconder = null;

function mostrarControles() {
  controles.classList.add("visivel");
  headerInfo.classList.add("visivel");
  botoesBusca.classList.add("visivel");
  clearTimeout(timerEsconder);
  timerEsconder = setTimeout(() => {
    controles.classList.remove("visivel");
    headerInfo.classList.remove("visivel");
    botoesBusca.classList.remove("visivel");
  }, 5000); // 5 segundos para não sumir rápido demais
}

document.getElementById("btnMostrar").addEventListener("click", mostrarControles);
document.getElementById("video").addEventListener("click", mostrarControles);
document.addEventListener("touchstart", mostrarControles);

/* ============================================================
   TOAST
   ============================================================ */
function mostrarToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("visivel");
  setTimeout(() => toast.classList.remove("visivel"), 2500);
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
document.getElementById("btnAnterior").addEventListener("click", () => {
  indiceAtual = (indiceAtual - 1 + listaCanais.length) % listaCanais.length;
  tocarCanal(indiceAtual);
  mostrarControles();
});

document.getElementById("btnProximo").addEventListener("click", () => {
  indiceAtual = (indiceAtual + 1) % listaCanais.length;
  tocarCanal(indiceAtual);
  mostrarControles();
});

/* ============================================================
   TELA CHEIA E GIRAR
   ============================================================ */
document.getElementById("btnFullscreen").addEventListener("click", () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
  mostrarControles();
});

let rotacionado = false;
document.getElementById("btnGirar").addEventListener("click", () => {
  rotacionado = !rotacionado;
  const video = document.getElementById("video");
  video.style.transform = rotacionado ? "rotate(90deg) scale(1.8)" : "none";
  mostrarControles();
});

/* ============================================================
   BUSCA DE CANAIS (PARSER M3U)
   ============================================================ */
async function carregarListaM3U(url, filtroPais = null, filtroNome = null) {
  mostrarToast("Carregando lista...");
  
  try {
    const resposta = await fetch(url);
    const texto = await resposta.text();
    const linhas = texto.split("\n");
    
    const canais = [];
    let nomeAtual = "";
    let logoAtual = "";
    let grupoAtual = "";
    
    for (let i = 0; i < linhas.length; i++) {
      const linha = linhas[i].trim();
      
      if (linha.startsWith("#EXTINF")) {
        // Extrai nome (última vírgula)
        const partes = linha.split(",");
        nomeAtual = partes[partes.length - 1].trim();
        
        // Extrai logo
        const matchLogo = linha.match(/tvg-logo="([^"]*)"/);
        logoAtual = matchLogo ? matchLogo[1] : "";
        
        // Extrai grupo
        const matchGrupo = linha.match(/group-title="([^"]*)"/);
        grupoAtual = matchGrupo ? matchGrupo[1] : "";
      } else if (linha.startsWith("http") && nomeAtual) {
        // Filtros
        let incluir = true;
        
        if (filtroPais && !grupoAtual.toLowerCase().includes(filtroPais.toLowerCase())) {
          incluir = false;
        }
        if (filtroNome && !nomeAtual.toLowerCase().includes(filtroNome.toLowerCase())) {
          incluir = false;
        }
        
        if (incluir) {
          canais.push({
            nome: nomeAtual,
            url: linha,
            logo: logoAtual
          });
        }
        
        nomeAtual = "";
        logoAtual = "";
        grupoAtual = "";
      }
    }
    
    if (canais.length === 0) {
      mostrarToast("Nenhum canal encontrado");
      return null;
    }
    
    mostrarToast(`${canais.length} canais carregados`);
    return canais;
    
  } catch (erro) {
    console.error(erro);
    mostrarToast("Erro ao carregar. Verifique a conexão.");
    return null;
  }
}

/* ============================================================
   AÇÕES DOS BOTÕES DE BUSCA
   ============================================================ */
async function buscarRegionais() {
  document.querySelectorAll("#botoesBusca button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btnRegionais").classList.add("ativo");
  
  // Filtra canais do Brasil com "paraiba" ou "pb" no nome/grupo
  const canais = await carregarListaM3U(LISTAS_BUSCA.regionais, "Brazil");
  if (canais) {
    // Tenta filtrar os da Paraíba
    const pb = canais.filter(c => 
      c.nome.toLowerCase().includes("paraíba") || 
      c.nome.toLowerCase().includes("paraiba") ||
      c.nome.toLowerCase().includes("pb")
    );
    const listaParaUsar = pb.length > 0 ? pb : canais;
    listaCanais = montarListaFinal(listaParaUsar);
    listaAtiva = "regionais";
    indiceAtual = 0;
    tocarCanal(0);
  }
  mostrarControles();
}

async function buscarAnatel() {
  document.querySelectorAll("#botoesBusca button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btnAnatel").classList.add("ativo");
  
  const canais = await carregarListaM3U(LISTAS_BUSCA.anatel, "Brazil");
  if (canais) {
    listaCanais = montarListaFinal(canais);
    listaAtiva = "anatel";
    indiceAtual = 0;
    tocarCanal(0);
  }
  mostrarControles();
}

async function buscarInternet() {
  document.querySelectorAll("#botoesBusca button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btnInternet").classList.add("ativo");
  
  // A lista global é muito grande, então vamos pegar uma amostra
  // Para performance, baixamos e pegamos os primeiros 100 canais de notícias ou gerais
  mostrarToast("Carregando lista global (pode demorar)...");
  
  try {
    const resposta = await fetch("https://iptv-org.github.io/iptv/index.m3u");
    const texto = await resposta.text();
    const linhas = texto.split("\n");
    
    const canais = [];
    let nomeAtual = "";
    let logoAtual = "";
    let count = 0;
    
    for (let i = 0; i < linhas.length; i++) {
      const linha = linhas[i].trim();
      if (linha.startsWith("#EXTINF")) {
        const partes = linha.split(",");
        nomeAtual = partes[partes.length - 1].trim();
        const matchLogo = linha.match(/tvg-logo="([^"]*)"/);
        logoAtual = matchLogo ? matchLogo[1] : "";
      } else if (linha.startsWith("http") && nomeAtual) {
        canais.push({ nome: nomeAtual, url: linha, logo: logoAtual });
        count++;
        nomeAtual = "";
        logoAtual = "";
        // Limita para não sobrecarregar
        if (count >= 150) break;
      }
    }
    
    if (canais.length > 0) {
      listaCanais = montarListaFinal(canais);
      listaAtiva = "internet";
      indiceAtual = 0;
      tocarCanal(0);
      mostrarToast(`${canais.length} canais internacionais carregados`);
    } else {
      mostrarToast("Nenhum canal encontrado");
    }
  } catch (e) {
    mostrarToast("Erro ao carregar lista global");
  }
  mostrarControles();
}

document.getElementById("btnRegionais").addEventListener("click", buscarRegionais);
document.getElementById("btnAnatel").addEventListener("click", buscarAnatel);
document.getElementById("btnInternet").addEventListener("click", buscarInternet);

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
window.addEventListener("load", () => {
  // Monta a lista inicial
  listaCanais = montarListaFinal(canaisBaseInicial);
  indiceAtual = 0;
  
  // Toca o primeiro canal (TV Nova Juarez)
  tocarCanal(0);
  
  // Atualiza contador
  atualizarContador();
  
  // Esconde splash após 4 segundos
  setTimeout(() => {
    const splash = document.getElementById("splash");
    splash.style.opacity = "0";
    setTimeout(() => splash.style.display = "none", 1200);
  }, 4000);
  
  // Mostra controles por 5s ao abrir
  setTimeout(mostrarControles, 500);
});
</script>
</body>
</html>
