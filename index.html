<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Nova Juarez</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    background:#000; color:#fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow:hidden; height:100vh; width:100vw;
  }

  /* PLAYER */
  #videoContainer { position:fixed; inset:0; background:#000; overflow:hidden; }
  #video {
    width:100%; height:100%; background:#000; display:block;
    object-fit:contain; transition: object-fit 0.3s ease;
  }

  /* FORMATOS DE TELA */
  #video.formato-16-9  { object-fit: contain; }
  #video.formato-4-3   { object-fit: contain; }
  #video.formato-vertical { object-fit: contain; }
  #video.formato-cinema { object-fit: cover; }
  #video.formato-preencher { object-fit: fill; }
  #video.formato-zoom  { object-fit: cover; transform: scale(1.15); }

  /* SPLASH */
  #splash {
    position:fixed; inset:0; z-index:100;
    background: radial-gradient(circle at center, #0a1628 0%, #000 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:20px;
    transition: opacity 0.8s ease;
  }
  #splash img { width:130px; margin-bottom:22px; filter: drop-shadow(0 0 18px rgba(0,180,255,0.5)); }
  #splash h1 {
    color:#00b4ff; font-size:26px; margin-bottom:18px;
    letter-spacing:2px; text-transform: uppercase;
  }
  #splash .linha { width:60px; height:2px; background:#00b4ff; margin:0 auto 18px; border-radius:2px; }
  #splash .creditos { font-size:13px; line-height:1.8; color:#a0b8d0; max-width:420px; }
  #splash .creditos b { color:#fff; }

  /* HEADER INFO */
  #headerInfo {
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; pointer-events:none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
    opacity:0; transition: opacity 0.4s ease;
  }
  #headerInfo.visivel { opacity:1; }
  #canalNome {
    background:rgba(0,0,0,0.65); padding:6px 14px;
    border-radius:18px; font-size:13px;
    border-left:3px solid #00b4ff; max-width:55%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #contadorCanais {
    background:rgba(0,180,255,0.15); padding:6px 14px;
    border-radius:18px; font-size:12px;
    border:1px solid rgba(0,180,255,0.3);
    color:#00b4ff; font-weight:bold; white-space:nowrap;
  }

  /* BOTÕES DE BUSCA */
  #botoesBusca {
    position:fixed; top:64px; right:18px; z-index:45;
    display:flex; flex-direction:column; gap:7px;
    opacity:0; transition: opacity 0.4s ease;
    pointer-events:none;
  }
  #botoesBusca.visivel { opacity:1; pointer-events:auto; }
  #botoesBusca button {
    background:rgba(20,30,45,0.9); color:#c0d0e0;
    border:1px solid rgba(0,180,255,0.3);
    padding:9px 15px; border-radius:8px;
    font-size:12px; cursor:pointer; text-align:left;
    transition: background 0.15s, color 0.15s;
    display:flex; align-items:center; gap:8px;
  }
  #botoesBusca button:hover { background:rgba(0,180,255,0.2); color:#fff; border-color:#00b4ff; }
  #botoesBusca button.ativo { background:#00b4ff; color:#000; border-color:#00b4ff; }

  /* BARRA DE CANAIS FUNCIONANDO (modo automático) */
  #barraCanais {
    position:fixed; bottom:90px; left:0; right:0; z-index:58;
    display:flex; gap:10px; padding:12px 18px;
    overflow-x:auto; overflow-y:hidden;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
    opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
    scrollbar-width:thin;
  }
  #barraCanais.visivel { opacity:1; pointer-events:auto; }
  #barraCanais::-webkit-scrollbar { height:5px; }
  #barraCanais::-webkit-scrollbar-thumb { background:#00b4ff; border-radius:5px; }
  #barraCanais::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); }

  .chipCanal {
    flex-shrink:0; min-width:110px;
    background:rgba(20,30,45,0.9);
    border:1px solid rgba(0,180,255,0.25);
    border-radius:10px; padding:8px 12px;
    cursor:pointer; transition: all 0.2s;
    text-align:center;
  }
  .chipCanal:hover { background:rgba(0,180,255,0.2); border-color:#00b4ff; }
  .chipCanal.ativo { background:#00b4ff; color:#000; border-color:#00b4ff; }
  .chipCanal .nome {
    font-size:11px; font-weight:bold;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:120px;
  }
  .chipCanal .status {
    font-size:9px; opacity:0.8; margin-top:3px;
  }
  .chipCanal .status.ok { color:#4ade80; }
  .chipCanal .status.off { color:#f87171; }
  .chipCanal.ativo .status { color:#000; }

  /* CONTROLES PRINCIPAIS */
  #controles {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; z-index:60;
    background:rgba(10,15,25,0.9); padding:10px 14px;
    border-radius:50px; opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
    border: 1px solid rgba(0,180,255,0.15);
    max-width:96vw; flex-wrap:wrap; justify-content:center;
  }
  #controles.visivel { opacity:1; pointer-events:auto; }
  #controles button {
    background:rgba(255,255,255,0.08); color:#fff; border:none;
    width:44px; height:44px; border-radius:50%;
    font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.15s, transform 0.15s;
    flex-shrink:0;
  }
  #controles button:hover { background:#00b4ff; transform:scale(1.08); }
  #controles button:active { transform:scale(0.95); }
  #controles button.destaque { background:rgba(255,80,80,0.25); border:1px solid rgba(255,80,80,0.5); }
  #controles button.destaque:hover { background:#ff5050; }

  /* SELETOR DE FORMATO */
  #seletorFormato {
    position:fixed; bottom:22px; left:18px; z-index:61;
    display:flex; flex-direction:column; gap:6px;
    opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
  }
  #seletorFormato.visivel { opacity:1; pointer-events:auto; }
  #seletorFormato button {
    background:rgba(20,30,45,0.9); color:#c0d0e0;
    border:1px solid rgba(0,180,255,0.25);
    padding:7px 12px; border-radius:7px;
    font-size:11px; cursor:pointer; text-align:left;
    transition: all 0.15s;
  }
  #seletorFormato button:hover { background:rgba(0,180,255,0.2); color:#fff; }
  #seletorFormato button.ativo { background:#00b4ff; color:#000; border-color:#00b4ff; }

  /* CONTROLE DE VOLUME */
  #volumeBox {
    position:fixed; bottom:22px; right:18px; z-index:61;
    display:flex; align-items:center; gap:8px;
    background:rgba(10,15,25,0.9); padding:8px 14px;
    border-radius:30px; border:1px solid rgba(0,180,255,0.2);
    opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
  }
  #volumeBox.visivel { opacity:1; pointer-events:auto; }
  #volumeBox .iconeVolume {
    font-size:16px; cursor:pointer; user-select:none;
    color:#00b4ff; flex-shrink:0;
  }
  #volumeSlider {
    -webkit-appearance:none; appearance:none;
    width:90px; height:4px; border-radius:2px;
    background:rgba(255,255,255,0.2);
    outline:none; cursor:pointer;
  }
  #volumeSlider::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:14px; height:14px; border-radius:50%;
    background:#00b4ff; cursor:pointer;
    box-shadow:0 0 6px rgba(0,180,255,0.6);
  }
  #volumeSlider::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%;
    background:#00b4ff; cursor:pointer; border:none;
  }

  /* BOTÃO FLUTUANTE */
  #btnMostrar {
    position:fixed; bottom:22px; right:22px; z-index:55;
    background:rgba(0,180,255,0.15); color:#00b4ff;
    border:1px solid rgba(0,180,255,0.3);
    width:44px; height:44px; border-radius:50%;
    font-size:18px; cursor:pointer;
    opacity:0.4; transition: opacity 0.3s, background 0.3s;
  }
  #btnMostrar:hover { opacity:1; background:rgba(0,180,255,0.3); }

  /* TOAST */
  #toast {
    position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
    background:rgba(0,180,255,0.92); color:#000; padding:9px 22px;
    border-radius:22px; font-size:13px; font-weight:bold;
    z-index:200; opacity:0; transition: opacity 0.3s;
    pointer-events:none; max-width:90vw; text-align:center;
  }
  #toast.visivel { opacity:1; }

  /* OVERLAY DE RECONEXÃO */
  #reconectando {
    position:fixed; inset:0; z-index:90;
    background:rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
  }
  #reconectando.visivel { display:flex; }
  #reconectando .spinner {
    width:44px; height:44px; border:3px solid rgba(0,180,255,0.2);
    border-top-color:#00b4ff; border-radius:50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #reconectando p { font-size:14px; color:#00b4ff; font-weight:bold; }
</style>
</head>
<body>

<div id="videoContainer">
  <video id="video" playsinline muted></video>
</div>

<div id="headerInfo">
  <div id="canalNome">TV Nova Juarez</div>
  <div id="contadorCanais">1 / 1</div>
</div>

<div id="botoesBusca">
  <button id="btnRegionais" title="Canais regionais da Paraíba">📍 Regionais (PB)</button>
  <button id="btnAnatel" title="Canais de TV aberta do Brasil">🏛️ TV Aberta / Anatel</button>
  <button id="btnInternet" title="Canais internacionais selecionados">🌐 Internet / Mundo</button>
</div>

<div id="splash">
  <img src="https://i.postimg.cc/nhWqywPS/lv-0-20260616101447.png" alt="Logo">
  <h1>TV Nova Juarez</h1>
  <div class="linha"></div>
  <div class="creditos">
    Aplicativo criado por <b>Rafael Edgley Alves Feliciano</b><br>
    Dono e proprietário da emissora <b>TV Nova Juarez</b><br>
    Criado em: <b>20/01/2023</b>
  </div>
</div>

<!-- BARRA DE CANAIS FUNCIONANDO (modo automático) -->
<div id="barraCanais"></div>

<!-- SELETOR DE FORMATO -->
<div id="seletorFormato">
  <button data-formato="16-9" class="ativo">📺 16:9 (Padrão)</button>
  <button data-formato="4-3">📻 4:3 (Clássico)</button>
  <button data-formato="vertical">📱 Vertical (Reels)</button>
  <button data-formato="cinema">🎬 Cinema (Preencher)</button>
  <button data-formato="preencher">🖥️ Preencher tela</button>
  <button data-formato="zoom">🔍 Zoom</button>
</div>

<!-- CONTROLE DE VOLUME -->
<div id="volumeBox">
  <span class="iconeVolume" id="iconeVolume">🔊</span>
  <input type="range" id="volumeSlider" min="0" max="100" value="100">
</div>

<button id="btnMostrar" title="Mostrar controles">☰</button>

<div id="controles">
  <button id="btnAnterior" title="Canal anterior">⏮</button>
  <button id="btnProximo" title="Próximo canal">⏭</button>
  <button id="btnRecarregar" title="Recarregar canal" class="destaque">🔃</button>
  <button id="btnReiniciarApp" title="Reiniciar aplicativo">⏻</button>
  <button id="btnFullscreen" title="Tela cheia">⛶</button>
  <button id="btnGirar" title="Girar tela">🔄</button>
</div>

<div id="reconectando">
  <div class="spinner"></div>
  <p>Reconectando...</p>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */
const URL_TV_NOVA_JUAREZ = "https://stmv2.webtvninjas.com.br/tvnovajuarez/tvnovajuarez/playlist.m3u8";
const LOGO_TV_NOVA_JUAREZ = "https://i.postimg.cc/nhWqywPS/lv-0-20260616101447.png";

const canalTVNovaJuarez = {
  nome: "TV Nova Juarez",
  url: URL_TV_NOVA_JUAREZ,
  logo: LOGO_TV_NOVA_JUAREZ
};

const canaisBaseInicial = [
  { nome: "Canal da Paraíba", url: URL_TV_NOVA_JUAREZ, logo: LOGO_TV_NOVA_JUAREZ },
  { nome: "TV Brasil", url: "https://stream.ads.ottera.tv/playlist.m3u8", logo: "" },
  { nome: "TV Câmara", url: "https://stream3.camara.gov.br/tv1/manifest.m3u8", logo: "" },
  { nome: "TV Senado", url: "https://stream3.senado.leg.br/senado-tv/senado-tv.m3u8", logo: "" }
];

const LISTAS_BUSCA = {
  regionais: "https://iptv-org.github.io/iptv/countries/br.m3u",
  anatel:    "https://iptv-org.github.io/iptv/categories/general.m3u",
  internet:  "https://iptv-org.github.io/iptv/countries/us.m3u"
};

/* ============================================================
   ESTADO
   ============================================================ */
let listaCanais = [];
let indiceAtual = 0;
let hls = null;
let timerEsconder = null;
let timerTimeoutCanal = null;
let timerAutoHideBarra = null;
const MAX_TENTATIVAS = 3;
const TIMEOUT_CARREGAMENTO = 15000;

const video = document.getElementById("video");
const controles = document.getElementById("controles");
const headerInfo = document.getElementById("headerInfo");
const botoesBusca = document.getElementById("botoesBusca");
const barraCanais = document.getElementById("barraCanais");
const seletorFormato = document.getElementById("seletorFormato");
const volumeBox = document.getElementById("volumeBox");
const overlayReconectando = document.getElementById("reconectando");

/* ============================================================
   VOLUME
   ============================================================ */
const volumeSlider = document.getElementById("volumeSlider");
const iconeVolume = document.getElementById("iconeVolume");
let volumeAnterior = 1;

video.volume = 1;
volumeSlider.value = 100;

volumeSlider.addEventListener("input", (e) => {
  const v = parseInt(e.target.value) / 100;
  video.volume = v;
  video.muted = (v === 0);
  atualizarIconeVolume(v);
});

function atualizarIconeVolume(v) {
  if (v === 0) iconeVolume.textContent = "🔇";
  else if (v < 0.5) iconeVolume.textContent = "🔉";
  else iconeVolume.textContent = "🔊";
}

iconeVolume.addEventListener("click", () => {
  if (video.muted || video.volume === 0) {
    video.muted = false;
    video.volume = volumeAnterior || 1;
    volumeSlider.value = video.volume * 100;
    atualizarIconeVolume(video.volume);
  } else {
    volumeAnterior = video.volume;
    video.muted = true;
    video.volume = 0;
    volumeSlider.value = 0;
    atualizarIconeVolume(0);
  }
});

/* ============================================================
   FORMATOS DE TELA
   ============================================================ */
let formatoAtual = "16-9";
document.querySelectorAll("#seletorFormato button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#seletorFormato button").forEach(b => b.classList.remove("ativo"));
    btn.classList.add("ativo");
    formatoAtual = btn.dataset.formato;
    aplicarFormato(formatoAtual);
    mostrarToast("Formato: " + btn.textContent.trim());
    mostrarControles();
  });
});

function aplicarFormato(f) {
  video.className = "";
  video.classList.add("formato-" + f);
  video.style.transform = (f === "zoom") ? "scale(1.15)" : "none";
}

/* ============================================================
   MONTAR LISTA
   ============================================================ */
function montarListaFinal(canaisBase) {
  const lista = [];
  lista.push(canalTVNovaJuarez);
  let contador = 0;
  const vistos = new Set([canalTVNovaJuarez.nome + "|" + canalTVNovaJuarez.url]);

  for (const canal of canaisBase) {
    if (!canal || !canal.url) continue;
    const chave = canal.nome + "|" + canal.url;
    if (vistos.has(chave)) continue;
    vistos.add(chave);

    if (contador > 0 && contador % 5 === 0) {
      lista.push(canalTVNovaJuarez);
    }
    lista.push(canal);
    contador++;
  }
  return lista;
}

/* ============================================================
   CONTADOR
   ============================================================ */
function atualizarContador() {
  document.getElementById("contadorCanais").textContent =
    `${indiceAtual + 1} / ${listaCanais.length}`;
}

/* ============================================================
   BARRA DE CANAIS FUNCIONANDO (modo automático)
   ============================================================ */
function renderizarBarraCanais() {
  barraCanais.innerHTML = "";
  // Mostra até 30 canais para não pesar
  const limite = Math.min(listaCanais.length, 30);
  for (let i = 0; i < limite; i++) {
    const canal = listaCanais[i];
    const chip = document.createElement("div");
    chip.className = "chipCanal" + (i === indiceAtual ? " ativo" : "");
    chip.innerHTML = `
      <div class="nome">${escapeHtml(canal.nome)}</div>
      <div class="status ok">● funcionando</div>
    `;
    chip.addEventListener("click", () => {
      tocarCanal(i);
      mostrarControles();
    });
    barraCanais.appendChild(chip);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   CONTROLES (AUTO-HIDE + barra de canais)
   ============================================================ */
function mostrarControles() {
  controles.classList.add("visivel");
  headerInfo.classList.add("visivel");
  botoesBusca.classList.add("visivel");
  seletorFormato.classList.add("visivel");
  volumeBox.classList.add("visivel");
  barraCanais.classList.add("visivel");

  clearTimeout(timerEsconder);
  timerEsconder = setTimeout(() => {
    controles.classList.remove("visivel");
    headerInfo.classList.remove("visivel");
    botoesBusca.classList.remove("visivel");
    seletorFormato.classList.remove("visivel");
    volumeBox.classList.remove("visivel");
    barraCanais.classList.remove("visivel");
  }, 6000);
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function mostrarToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("visivel");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("visivel"), 2500);
}

/* ============================================================
   DESTRUIR PLAYER
   ============================================================ */
function destruirPlayer() {
  if (hls) {
    try { hls.destroy(); } catch (e) {}
    hls = null;
  }
  try {
    video.pause();
    video.removeAttribute("src");
    video.load();
  } catch (e) {}
  clearTimeout(timerTimeoutCanal);
}

/* ============================================================
   TOCAR CANAL
   ============================================================ */
function tocarCanal(indice, tentativa = 0) {
  if (!listaCanais.length) return;
  if (indice < 0) indice = 0;
  if (indice >= listaCanais.length) indice = listaCanais.length - 1;

  indiceAtual = indice;
  const canal = listaCanais[indice];

  document.getElementById("canalNome").textContent = canal.nome;
  atualizarContador();

  destruirPlayer();
  overlayReconectando.classList.remove("visivel");

  // Mantém volume atual
  video.volume = parseInt(volumeSlider.value) / 100;
  video.muted = (video.volume === 0);

  // Timeout de carregamento
  clearTimeout(timerTimeoutCanal);
  timerTimeoutCanal = setTimeout(() => {
    if (video.readyState < 2) {
      if (tentativa < MAX_TENTATIVAS) {
        overlayReconectando.classList.add("visivel");
        setTimeout(() => tocarCanal(indice, tentativa + 1), 1000);
      } else {
        overlayReconectando.classList.remove("visivel");
        mostrarToast("Canal indisponível, pulando...");
        setTimeout(() => {
          const prox = (indice + 1) % listaCanais.length;
          tocarCanal(prox, 0);
        }, 1500);
      }
    }
  }, TIMEOUT_CARREGAMENTO);

  // Native HLS
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = canal.url;
    video.play().catch(() => {});
    video.onloadeddata = () => {
      clearTimeout(timerTimeoutCanal);
      overlayReconectando.classList.remove("visivel");
    };
    video.onerror = () => {
      if (tentativa < MAX_TENTATIVAS) {
        overlayReconectando.classList.add("visivel");
        setTimeout(() => tocarCanal(indice, tentativa + 1), 1500);
      } else {
        overlayReconectando.classList.remove("visivel");
        const prox = (indice + 1) % listaCanais.length;
        tocarCanal(prox, 0);
      }
    };
    return;
  }

  // hls.js
  if (Hls.isSupported()) {
    hls = new Hls({
      maxBufferLength: 20,
      maxMaxBufferLength: 40,
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 10,
      capLevelToPlayerSize: true,
      startLevel: -1
    });

    hls.loadSource(canal.url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (!data.fatal) return;

      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        if (tentativa < MAX_TENTATIVAS) {
          overlayReconectando.classList.add("visivel");
          setTimeout(() => tocarCanal(indice, tentativa + 1), 1500);
        } else {
          overlayReconectando.classList.remove("visivel");
          mostrarToast("Sem conexão, pulando...");
          const prox = (indice + 1) % listaCanais.length;
          setTimeout(() => tocarCanal(prox, 0), 1500);
        }
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try { hls.recoverMediaError(); } catch (e) {}
      } else {
        overlayReconectando.classList.remove("visivel");
        const prox = (indice + 1) % listaCanais.length;
        setTimeout(() => tocarCanal(prox, 0), 1500);
      }
    });

    return;
  }

  mostrarToast("Formato não suportado");
}

/* ============================================================
   FETCH COM TIMEOUT
   ============================================================ */
async function fetchComTimeout(url, ms = 12000) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), ms);
  try {
    const r = await fetch(url, { signal: controller.signal });
    clearTimeout(id);
    return r;
  } catch (e) {
    clearTimeout(id);
    throw e;
  }
}

/* ============================================================
   PARSER M3U
   ============================================================ */
function parsearM3U(texto, limite = 80) {
  const linhas = texto.split("\n");
  const canais = [];
  let nomeAtual = "", logoAtual = "", grupoAtual = "";

  for (let i = 0; i < linhas.length; i++) {
    const linha = linhas[i].trim();
    if (!linha) continue;

    if (linha.startsWith("#EXTINF")) {
      const partes = linha.split(",");
      nomeAtual = partes[partes.length - 1].trim();
      const mLogo = linha.match(/tvg-logo="([^"]*)"/);
      logoAtual = mLogo ? mLogo[1] : "";
      const mGrupo = linha.match(/group-title="([^"]*)"/);
      grupoAtual = mGrupo ? mGrupo[1] : "";
    } else if (linha.startsWith("http") && nomeAtual) {
      canais.push({ nome: nomeAtual, url: linha, logo: logoAtual, grupo: grupoAtual });
      nomeAtual = ""; logoAtual = ""; grupoAtual = "";
      if (canais.length >= limite) break;
    }
  }
  return canais;
}

/* ============================================================
   CACHE
   ============================================================ */
const cacheListas = {};

async function obterLista(url, limite = 80) {
  if (cacheListas[url]) return cacheListas[url];
  mostrarToast("Carregando lista...");
  const resp = await fetchComTimeout(url);
  const texto = await resp.text();
  const canais = parsearM3U(texto, limite);
  cacheListas[url] = canais;
  return canais;
}

    const canais = await obterLista(LISTAS_BUSCA.regionais, 60);
    const pb = canais.filter(c =>
      (c.nome && (c.nome.toLowerCase().includes("paraíba") ||
                  c.nome.toLowerCase().includes("paraiba") ||
                  c.nome.toLowerCase().includes("pb "))) ||
      (c.grupo && c.grupo.toLowerCase().includes("paraíba"))
    );
    const usar = pb.length > 0 ? pb : canais.slice(0, 30);
    listaCanais = montarListaFinal(usar);
    indiceAtual = 0;

    renderizarBarraCanais();
    mostrarToast(`${listaCanais.length} canais regionais carregados`);

  mostrarControles();
}
